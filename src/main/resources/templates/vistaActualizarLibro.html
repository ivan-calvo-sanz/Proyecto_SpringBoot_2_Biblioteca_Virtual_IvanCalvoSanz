<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar Libro</title>
</head>

<body>


    <h1>ACTUALIZAR LIBRO</h1>
    <!-- th:action="@{/actualizarLibro}"  ->  utilizando thymeleaf cuando se envia el formulario lanza @PostMapping("/actualizarLibro") -->
    <form th:action="@{/actualizarLibro}" method="post" required>
        <input type="hidden" name="idLibro" th:value="${libro.idLibro}">
        <input type="text" name="titulo" placeholder="Titulo" th:value="${libro.titulo}" required>
        <input type="text" name="autor" placeholder="Autor" th:value="${libro.autor}" required>
        <input type="text" name="isbn" placeholder="ISBN" th:value="${libro.isbn}" required>
        <button type="submit">Actualizar</button>
    </form>

</body>

</html>
