<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar Libro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-4 col-md-6">
            <div class="text-center mb-3">
                <h1>ACTUALIZAR LIBRO</h1>
            </div>

            <!-- th:action="@{/actualizarLibro}"  ->  utilizando thymeleaf cuando se envia el formulario lanza @PostMapping("/actualizarLibro") -->
            <form th:action="@{/actualizarLibro}" method="post" required>
                <input type="hidden" name="idLibro" th:value="${libro.idLibro}">
                <div class="mb-3">
                    <label id="titulo" class="form-label">Titulo</label>
                    <input id="titulo" class="form-control" type="text" name="titulo" placeholder="Titulo" required
                        th:value="${libro.titulo}">
                </div>
                <div class="mb-3">
                    <label id="autor" class="form-label">Autor</label>
                    <input id="autor" class="form-control" type="text" name="autor" placeholder="Autor" required
                        th:value="${libro.autor}">
                </div>
                <div class="mb-3">
                    <label id="isbn" class="form-label">ISBN</label>
                    <input id="isbn" class="form-control" type="text" name="isbn" placeholder="ISBN" required
                        th:value="${libro.isbn}">
                </div>
                <div class="mt-2">
                    <a class="btn btn-secondary" href="/">Cancelar</a>
                    <button class="btn btn-primary" type="submit">Actualizar</button>
                </div>
            </form>

        </div>
    </div>

</body>

</html>
